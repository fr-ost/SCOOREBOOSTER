<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ScoreX</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup-body">
  <div class="popup" id="popup">
    <header class="p-head">
      <span class="wordmark">Score<span class="wordmark-x" aria-hidden="true">X</span></span>
      <span class="p-spacer"></span>
      <span id="pMode" class="p-mode"></span>
    </header>
    <section class="p-status" id="pStatusBox" aria-live="polite"></section>
    <div id="pAlert" class="p-alert" role="alert" hidden></div>
    <div class="p-controls" id="pControls"></div>
    <section class="p-quota" id="pQuota" aria-label="Today's quota"></section>
    <div id="pPendingSlot"></div>
    <div class="p-costs" id="pCosts"></div>
    <button type="button" class="btn p-open" id="pOpen">Open dashboard</button>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
